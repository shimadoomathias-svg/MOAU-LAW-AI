
<script>
const tabs = [...document.querySelectorAll('.tab')];

// Keep the source and generated summary available for evaluation.
let originalSourceFile = null;
let generatedSummaryFile = null;

function transferFile(file, input) {
  try {
    const transfer = new DataTransfer();
    transfer.items.add(file);
    input.files = transfer.files;
    return true;
  } catch (error) {
    // The evaluation request will still receive the stored File object.
    return false;
  }
}

tabs.forEach(t => t.addEventListener('click', () => {
  tabs.forEach(x => x.classList.toggle('active', x === t));
  document.getElementById('summarizePanel').classList.toggle('hidden', t.dataset.tab !== 'summarize');
  document.getElementById('evaluatePanel').classList.toggle('hidden', t.dataset.tab !== 'evaluate');
}));

async function submitForm(formId, endpoint, statusId, resultId, outputId, buttonText) {
  const form = document.getElementById(formId);
  const status = document.getElementById(statusId);
  const result = document.getElementById(resultId);
  const output = document.getElementById(outputId);
  const button = form.querySelector('button[type="submit"]');

  form.addEventListener('submit', async e => {
    e.preventDefault();

    status.className = 'status';
    status.textContent = 'Working… This may take a little while on a free model.';
    button.disabled = true;
    button.textContent = 'Please wait…';
    result.style.display = 'none';

    try {
      const formData = new FormData(form);

      // Make sure the evaluator receives the stored files,
      // even if the browser does not allow the file inputs to be populated.
      if (formId === 'evaluateForm') {
        const originalInput = document.getElementById('origFile');
        const summaryInput = document.getElementById('summaryFile');

        if ((!originalInput.files || !originalInput.files.length) && originalSourceFile) {
          formData.set('original_file', originalSourceFile);
        }

        if ((!summaryInput.files || !summaryInput.files.length) && generatedSummaryFile) {
          formData.set('summary_file', generatedSummaryFile);
        }
      }

      const response = await fetch(endpoint, {
        method: 'POST',
        body: formData
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.detail || 'The request failed.');
      }

      output.textContent = data.summary || data.evaluation || 'No text was returned.';
      result.style.display = 'block';

      if (formId === 'summarizeForm' && data.summary) {
        const pastedOriginal = document.getElementById('sumText').value.trim();
        const sourceFile = document.getElementById('sumFile');

        const evalOriginal = document.getElementById('origText');
        const evalOriginalFile = document.getElementById('origFile');
        const evalSummary = document.getElementById('summaryText');
        const evalSummaryFile = document.getElementById('summaryFile');

        // Transfer the generated summary as text.
        evalSummary.value = data.summary;

        // Also create a real TXT file from the generated summary.
        generatedSummaryFile = new File(
          [data.summary],
          'generated-summary.txt',
          { type: 'text/plain' }
        );

        transferFile(generatedSummaryFile, evalSummaryFile);

        // Transfer the original source document.
        if (pastedOriginal) {
          originalSourceFile = null;
          evalOriginal.value = pastedOriginal;
          evalOriginalFile.value = '';
        } else if (sourceFile.files && sourceFile.files.length) {
          originalSourceFile = sourceFile.files[0];
          evalOriginal.value = '';
          transferFile(originalSourceFile, evalOriginalFile);
        } else {
          originalSourceFile = null;
          evalOriginal.value = '';
          evalOriginalFile.value = '';
        }

        status.className = 'status success';
        status.textContent =
          'Summary ready. The original document and generated summary have been prepared for evaluation. Open Evaluate a summary and tap Evaluate summary.';

      } else {
        status.className = 'status success';
        status.textContent =
          'Evaluation complete. Please verify the result against the original document.';
      }

      result.scrollIntoView({ behavior: 'smooth', block: 'start' });

    } catch (err) {
      status.className = 'status error';
      status.textContent = err.message || 'Something went wrong. Please try again.';
    } finally {
      button.disabled = false;
      button.textContent = buttonText;
    }
  });
}

submitForm(
  'summarizeForm',
  '/api/summarize',
  'sumStatus',
  'sumResult',
  'sumOutput',
  'Generate summary'
);

submitForm(
  'evaluateForm',
  '/api/evaluate',
  'evalStatus',
  'evalResult',
  'evalOutput',
  'Evaluate summary'
);

document.getElementById('copySummary').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('sumOutput').textContent);
});

document.getElementById('goEvaluate').addEventListener('click', () => {
  document.querySelector('[data-tab="evaluate"]').click();
  document.getElementById('evaluatePanel').scrollIntoView({
    behavior: 'smooth',
    block: 'start'
  });
});

document.getElementById('copyEvaluation').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('evalOutput').textContent);
});
</script>
